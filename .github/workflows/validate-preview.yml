name: Validate OCODEJS Learning preview
on:
  push:
    branches: [feat/cloudflare-pages-staging-deploy]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and validate static app
        run: npm run build
